# PROPOSED — RAG + evidence agreement + calibrated abstention
_base_: "default.yaml"

experiment:
  name: "proposed_agreement_abstention"
  description: "B2 features PLUS evidence-agreement NLI score. Same calibration/threshold procedure as B2."

calibration:
  method: "platt"
  features:
    - "top_retrieval_sim"
    - "mean_token_logprob"
    - "min_token_logprob"
    - "answer_length"
    - "agreement_score"   # <-- the only new feature vs B2
